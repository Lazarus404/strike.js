<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strike Todo</title>
    <link rel="stylesheet" href="../../ui/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--strike-ink);
        background: var(--strike-fill);
      }
      #app {
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      .todo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .todo-list li.done span {
        text-decoration: line-through;
        color: var(--strike-muted);
      }
      .todo-add .strike-field {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"><i>Loading</i></div>
    <!-- app.js from: npm run build:jsx -->
    <script type="module" src="./app.js"></script>

  </body>
</html>
