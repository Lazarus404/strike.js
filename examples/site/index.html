<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northline</title>
    <link rel="stylesheet" href="../../ui/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--strike-ink);
        background: var(--strike-fill);
      }
      #app {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
        box-sizing: border-box;
      }
      .site {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        min-height: calc(100vh - 3rem);
      }
      .site-nav a {
        color: inherit;
        text-decoration: none;
      }
      .site-nav a:hover {
        color: var(--strike-accent);
      }
      .site-nav a.is-active {
        color: var(--strike-accent);
        font-weight: 600;
      }
      .site-brand {
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-right: 0.5rem;
      }
      .site-main {
        flex: 1;
      }
      .site-work {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .site-work li {
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--strike-line);
      }
      .site-foot {
        padding-top: 1rem;
        border-top: 1px solid var(--strike-line);
      }
    </style>
      <script type="importmap">
    {
      "imports": {
        "strike/jsx-runtime": "../../jsx-runtime.js",
        "strike/jsx-dev-runtime": "../../jsx-runtime.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"><i>Loading</i></div>
    <!-- app.js from: npm run build:jsx -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
